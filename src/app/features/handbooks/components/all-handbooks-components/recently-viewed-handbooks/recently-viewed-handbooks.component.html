<div class="card">
    <header class="header" [class.header_expanded]="expanded">
        <div class="title">
            <div tuiAvatar="@tui.clock-4" appearance="info" size="s"></div>

            <div>Недавно просмотренные</div>
        </div>

        <button
            tuiButton
            [tuiChevron]="expanded"
            type="button"
            appearance="flat"
            aria-label="Показать или скрыть недавно просмотренные"
            (click)="expanded = !expanded"
        ></button>
    </header>

    <tui-expand [expanded]="expanded">
        <div class="content">
            @for (handbook of displayedHandbooks(); track handbook.id) {
                <app-handbooks-list-item
                    [handbook]="handbook"
                    [isHandbooksList]="false"
                />
            }
        </div>
    </tui-expand>
</div>
