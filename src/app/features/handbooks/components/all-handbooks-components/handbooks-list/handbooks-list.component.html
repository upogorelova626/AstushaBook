<div class="wrapper" [tuiSkeleton]="isLoading()">
    @if (handbookPreviews().length === 0 && !isLoading()) {
        <div class="empty"> Ничего не найдено </div>
    } @else {
        @for (handbook of handbookPreviews(); track handbook.id) {
            <app-handbooks-list-item
                [handbook]="handbook"
                [isHandbooksList]="true"
            />
        }
    }
</div>
