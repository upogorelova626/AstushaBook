<div class="page">
    <div class="recent">
        @if (isRecentlyViewedVisible()) {
            <app-recently-viewed-handbooks />
        }
    </div>

    <div class="content">
        <main class="main">
            <app-handbook-toolbar />

            <app-handbooks-list />
            <div #loadMore class="load-more"></div>
        </main>

        <aside class="sidebar">
            <app-handbooks-filters />

            <app-handbooks-guide-card />
        </aside>
    </div>
</div>
