@if (!isEditing()) {
    <button
        tuiButton
        appearance="flat"
        iconStart="@tui.pen"
        (click)="startEditing()"
        >Редактировать ячейки</button
    >
} @else {
    <div class="buttons">
        <button tuiButton appearance="flat" (click)="cancel()"
            >Отменить изменения</button
        >
        <button tuiButton iconStart="@tui.check" (click)="save()"
            >Сохранить</button
        >
    </div>
}
