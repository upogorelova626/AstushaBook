<div class="wrapper">
    <table class="table" tuiTable>
        <thead class="thead">
            <tr>
                <th tuiTh class="fixed">
                    <input type="checkbox" tuiCheckbox />
                </th>
                @for (column of handbook()?.columns; track $index) {
                    <th tuiTh>{{ column.name }}</th>
                }
                <th tuiTh class="fixed">
                    <button
                        tuiButton
                        appearance="flat"
                        iconStart="@tui.bolt"
                    ></button>
                </th>
            </tr>
        </thead>
        <!-- <tbody tuiTbody>
            <tr>
                <td tuiTd></td>
                <td tuiTd></td>
                <td tuiTd></td>
                <td tuiTd></td>
                <td tuiTd></td>
            </tr>
        </tbody> -->
    </table>
    @if (strings().length === 0) {
        <div class="empty">
            <div class="empty-text">Нет строк</div>
            <button tuiButton iconStart="@tui.plus" appearance="flat"
                >Строка</button
            >
        </div>
    }
</div>
